# Custom light theme for the FunnelIQ dashboard - a validated, colorblind-safe
# palette (see dashboard/app.py and dashboard/pages/2_Budget_Simulator.py for
# the matching Plotly chart colors, kept in sync with these theme roles by hand).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"
